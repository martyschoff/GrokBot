<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trade Recommendations</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2.5rem;
      color: #667eea;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      font-size: 1.1rem;
    }

    .meta-info {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eee;
      flex-wrap: wrap;
    }

    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .meta-label {
      font-size: 0.85rem;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .meta-value {
      font-size: 1rem;
      color: #333;
      font-weight: 500;
    }

    .error-message {
      background: #fee;
      border: 1px solid #fcc;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      color: #c33;
    }

    .loading-message {
      background: #e3f2fd;
      border: 1px solid #90caf9;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      color: #1976d2;
    }

    .recommendations-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .ticker-card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .ticker-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
    }

    .ticker-symbol {
      font-size: 1.8rem;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 16px;
    }

    .rating-section {
      margin-bottom: 16px;
    }

    .rating-section:last-child {
      margin-bottom: 0;
    }

    .rating-header {
      font-size: 0.85rem;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .rating-value {
      font-size: 1.2rem;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 4px;
    }

    .rating-buy {
      background: #d4edda;
      color: #155724;
    }

    .rating-strong-buy {
      background: #c3e6cb;
      color: #0a3d14;
    }

    .rating-hold {
      background: #fff3cd;
      color: #856404;
    }

    .rating-sell {
      background: #f8d7da;
      color: #721c24;
    }

    .rating-none {
      background: #e9ecef;
      color: #6c757d;
    }

    .rating-link {
      font-size: 0.85rem;
      color: #667eea;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .rating-link:hover {
      text-decoration: underline;
    }

    .rating-change {
      font-size: 0.85rem;
      color: #666;
      margin-top: 4px;
    }

    footer {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      margin-top: 30px;
      text-align: center;
      color: #666;
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 1.8rem;
      }

      .recommendations-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Trade Recommendations</h1>
      <p class="subtitle">Seeking Alpha & Yahoo Finance Ratings</p>
      <div class="meta-info" id="meta-info"></div>
    </header>

    <div id="loading" class="loading-message">
      Loading recommendations...
    </div>

    <div id="error" class="error-message" style="display: none;"></div>

    <div id="recommendations" class="recommendations-grid"></div>

    <footer>
      <p>Data sources: Seeking Alpha, Yahoo Finance</p>
      <p style="margin-top: 8px;">
        <small>Recommendations are for informational purposes only. Not financial advice.</small>
      </p>
    </footer>
  </div>

  <script>
    const DEFAULT_URL = 'http://martin-trade.s3-website-us-east-1.amazonaws.com/recommendations.json';
    const FALLBACK_PATH = './fixtures/recommendations.example.json';

    function getRatingClass(rating) {
      if (!rating) return 'rating-none';
      const normalized = rating.toLowerCase().replace(/\s+/g, '-');
      if (normalized.includes('strong-buy')) return 'rating-strong-buy';
      if (normalized.includes('buy')) return 'rating-buy';
      if (normalized.includes('hold')) return 'rating-hold';
      if (normalized.includes('sell')) return 'rating-sell';
      return 'rating-none';
    }

    function formatRating(rating) {
      return rating || 'N/A';
    }

    function formatDate(dateStr) {
      if (!dateStr) return 'N/A';
      try {
        const date = new Date(dateStr);
        return date.toLocaleString('en-US', {
          year: 'numeric',
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      } catch {
        return dateStr;
      }
    }

    function renderMetaInfo(data) {
      const metaInfo = document.getElementById('meta-info');
      const html = `
        <div class="meta-item">
          <span class="meta-label">Tickers</span>
          <span class="meta-value">${data.tickers.length}</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Floor</span>
          <span class="meta-value">$${data.floor.toLocaleString()}</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">SA Updated</span>
          <span class="meta-value">${formatDate(data.as_of.sa)}</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Yahoo Updated</span>
          <span class="meta-value">${formatDate(data.as_of.yahoo)}</span>
        </div>
      `;
      metaInfo.innerHTML = html;
    }

    function renderRecommendations(data) {
      const container = document.getElementById('recommendations');
      
      const html = data.tickers.map(ticker => {
        let saSection = '';
        if (ticker.sa) {
          const ratingClass = getRatingClass(ticker.sa.rating);
          let changeInfo = '';
          if (ticker.sa.previous && ticker.sa.changed_at) {
            changeInfo = `
              <div class="rating-change">
                Previous: ${ticker.sa.previous} (${formatDate(ticker.sa.changed_at)})
              </div>
            `;
          }
          saSection = `
            <div class="rating-section">
              <div class="rating-header">Seeking Alpha</div>
              <div class="rating-value ${ratingClass}">${formatRating(ticker.sa.rating)}</div>
              ${changeInfo}
              <a href="${ticker.sa.url}" target="_blank" class="rating-link">
                View on SA ↗
              </a>
            </div>
          `;
        }

        let yahooSection = '';
        if (ticker.yahoo) {
          const ratingClass = getRatingClass(ticker.yahoo.rating);
          yahooSection = `
            <div class="rating-section">
              <div class="rating-header">Yahoo Finance</div>
              <div class="rating-value ${ratingClass}">${formatRating(ticker.yahoo.rating)}</div>
              <a href="${ticker.yahoo.url}" target="_blank" class="rating-link">
                View on Yahoo ↗
              </a>
            </div>
          `;
        }

        return `
          <div class="ticker-card">
            <div class="ticker-symbol">${ticker.ticker}</div>
            ${saSection}
            ${yahooSection}
          </div>
        `;
      }).join('');

      container.innerHTML = html;
    }

    async function loadRecommendations() {
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const recommendations = document.getElementById('recommendations');

      const dataUrl = window.TRADE_RECOMMENDATIONS_URL || DEFAULT_URL;

      try {
        const response = await fetch(dataUrl);
        
        if (!response.ok) {
          throw new Error(`Failed to fetch from ${dataUrl}: ${response.status} ${response.statusText}`);
        }

        const data = await response.json();
        
        loading.style.display = 'none';
        renderMetaInfo(data);
        renderRecommendations(data);
      } catch (err) {
        console.error('Error loading recommendations:', err);
        
        try {
          const fallbackResponse = await fetch(FALLBACK_PATH);
          if (!fallbackResponse.ok) {
            throw new Error('Fallback also failed');
          }
          const data = await fallbackResponse.json();
          
          loading.style.display = 'none';
          error.style.display = 'block';
          error.textContent = `Could not load from ${dataUrl}. Using local fixture data.`;
          
          renderMetaInfo(data);
          renderRecommendations(data);
        } catch (fallbackErr) {
          loading.style.display = 'none';
          error.style.display = 'block';
          error.textContent = `Error loading recommendations: ${err.message}`;
          recommendations.innerHTML = '';
        }
      }
    }

    document.addEventListener('DOMContentLoaded', loadRecommendations);
  </script>
</body>
</html>
